name: Deploy a corazon.lightbox.mx (FTP Neubox)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: "deploy-ftp"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🔗 URL del backend
        if: ${{ vars.API_URL != '' }}
        run: |
          sed -i "s|apiUrl: '.*'|apiUrl: '${{ vars.API_URL }}'|" src/environments/environment.ts
          grep -n "apiUrl" src/environments/environment.ts

      - name: 🏗️ Build Angular
        run: npx ng build --configuration production

      # La cuenta FTP ya entra directo a /home/lightbo2/corazon.lightbox.mx, por eso server-dir es ./
      # El certificado FTPS de Neubox es del servidor (svgp189), no de ftp.lightbox.mx
      - name: 🚀 Subir por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.FTP_SERVER || 'svgp189.serverneubox.com.mx' }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/landing-page-clinica-rome/browser/
          server-dir: ./
