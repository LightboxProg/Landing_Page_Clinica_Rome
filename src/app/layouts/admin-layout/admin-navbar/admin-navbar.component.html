<nav class="admin-navbar">
  <div class="navbar-brand">
    <div class="logo-icon">
      <i class="fas fa-spa"></i>
    </div>
    <div class="brand-text">
      <h2>Clínica Rome</h2>
      <span>Panel Administrativo</span>
    </div>
  </div>

  <div class="navbar-actions">
    <div class="user-info" *ngIf="usuarioNombre">
      <div class="avatar">
        <i class="fas fa-user-circle"></i>
      </div>
      <span class="user-name">{{ usuarioNombre }}</span>
    </div>

    <button class="btn-logout" (click)="logout()" title="Cerrar sesión">
      <i class="fas fa-sign-out-alt"></i>
      <span>Salir</span>
    </button>
  </div>

  <div class="nav-links">
    <a routerLink="/usuarios" routerLinkActive="active">
      <i class="fas fa-users"></i> Usuarios
    </a>
    <a routerLink="/usuarios/nuevo" routerLinkActive="active">
      <i class="fas fa-user-plus"></i> Nuevo
    </a>
  </div>

</nav>
