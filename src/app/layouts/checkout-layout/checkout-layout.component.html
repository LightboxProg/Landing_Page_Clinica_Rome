<div class="co">
  <!-- A checkout frame should recede. Wordmark, one exit, nothing else. -->
  <header class="co__mast">
    <div class="co__shell co__mast-inner">
      <a routerLink="/" class="co__brand" aria-label="ROME Harmony Clinic — inicio">
        <img src="assets/images/rome.webp" alt="ROME Harmony Clinic" />
      </a>

      <p class="co__secure u-data">
        <i class="fas fa-lock" aria-hidden="true"></i>
        Conexión segura
      </p>

      <a routerLink="/" class="co__exit u-data">
        Salir
        <i class="fas fa-xmark" aria-hidden="true"></i>
      </a>
    </div>
  </header>

  <main class="co__main">
    <router-outlet></router-outlet>
  </main>

  <footer class="co__foot">
    <div class="co__shell co__foot-inner">
      <p class="co__copy u-data">© 2025 ROME Harmony Clinic</p>
      <nav class="co__legal u-data" aria-label="Avisos legales">
        <a routerLink="/aviso-privacidad" target="_blank" rel="noopener">Aviso de privacidad</a>
        <a routerLink="/aviso-terminos" target="_blank" rel="noopener">Términos del servicio</a>
      </nav>
    </div>
  </footer>
</div>
