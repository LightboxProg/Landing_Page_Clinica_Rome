<header class="mast" [class.is-condensed]="condensed">
  <!-- Practice strip: the two arms of the clinic, stated plainly -->
  <div class="mast-strip">
    <div class="u-shell mast-strip__inner">
      <p class="mast-strip__disciplines u-data">
        Armonización facial<span class="mast-strip__sep">·</span>Odontología estética
      </p>
      <div class="mast-strip__reach u-data">
        <a href="tel:+524493664109">(449) 366 4109</a>
        <span class="mast-strip__sep">·</span>
        <a href="mailto:contacto&#64;clinicarome.com">contacto&#64;clinicarome.com</a>
      </div>
    </div>
  </div>

  <div class="mast-bar">
    <div class="u-shell mast-bar__inner">
      <a routerLink="/" class="mast-logo" aria-label="ROME Harmony Clinic — inicio" (click)="closeMenu()">
        <img src="assets/images/rome.webp" alt="ROME Harmony Clinic" />
      </a>

      <nav class="mast-nav" [class.is-open]="menuOpen" aria-label="Principal">
        <ul>
          <li><a routerLink="/" routerLinkActive="is-current" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">Inicio</a></li>
          <li><a routerLink="/servicios" routerLinkActive="is-current" (click)="closeMenu()">Servicios</a></li>
          <li><a routerLink="/membresias" routerLinkActive="is-current" (click)="closeMenu()">Membresías</a></li>
          <li><a routerLink="/nosotros" routerLinkActive="is-current" (click)="closeMenu()">Nosotros</a></li>
          <li><a routerLink="/contacto" routerLinkActive="is-current" (click)="closeMenu()">Contacto</a></li>
        </ul>

        <a routerLink="/agendar-cita" class="btn btn--solid mast-nav__cta" (click)="closeMenu()">
          Agendar valoración
        </a>
      </nav>

      <a routerLink="/agendar-cita" class="btn btn--solid mast-cta" (click)="closeMenu()">
        Agendar valoración
      </a>

      <button
        class="mast-toggle"
        (click)="toggleMenu()"
        [class.is-open]="menuOpen"
        [attr.aria-expanded]="menuOpen"
        aria-controls="mast-nav"
        aria-label="Menú de navegación">
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>
