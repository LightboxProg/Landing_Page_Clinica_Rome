<div class="contenedor-lista-pacientes">
  <div class="tarjeta-lista">
    <div class="encabezado-lista">
      <div><i class="fas fa-users"></i><h3>Lista de Pacientes</h3></div>
      <div class="contador-pacientes"><span class="numero">{{pacientes.length}}</span><span class="texto">Pacientes</span></div>
    </div>
    <div class="lista-elementos">
      <div *ngFor="let paciente of pacientes" class="elemento-wrapper">
        <app-element-paciente [paciente]="paciente"></app-element-paciente>
      </div>
      <div *ngIf="pacientes.length === 0" class="sin-resultados">
        <i class="fas fa-inbox"></i><p>No se encontraron pacientes</p>
      </div>
    </div>
  </div>
</div>
