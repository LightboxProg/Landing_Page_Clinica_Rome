<div class="message-bubble" [class.sent]="isSent" [class.received]="!isSent">
  <div class="bubble-content">
    <img *ngIf="message.mediaUrl" [src]="message.mediaUrl" class="message-media" />
    <p>{{ message.body }}</p>
    <div class="msg-footer">
      <span class="msg-time">{{ formatTime(message.timestamp) }}</span>
      <i *ngIf="isSent && message.status" class="fas" role="img"
         [class.fa-clock]="message.status === 'pending'"
         [class.fa-check]="message.status === 'sent'"
         [class.fa-check-double]="message.status === 'delivered' || message.status === 'read'"
         [class.read]="message.status === 'read'"
         [class.fa-exclamation-circle]="message.status === 'failed'"
         [attr.title]="descripcionEstado"
         [attr.aria-label]="descripcionEstado"></i>
    </div>
  </div>
  <p class="msg-error" *ngIf="isSent && message.status === 'failed'">
    <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
    No entregado{{ message.errorEnvio?.mensaje ? ': ' + message.errorEnvio.mensaje : '' }}
  </p>
</div>
