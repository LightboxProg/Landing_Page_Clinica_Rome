<div class="template-config-wrapper">

  <div class="form-group mb-4">
    <span class="section-label">Plantilla de mensaje Meta</span>
    <div class="custom-select-wrapper">
      <i class="fas fa-file-invoice select-icon"></i>
      <select class="form-select-corporate"
              (change)="seleccionarPlantillaV2($event)"
              [value]="plantillaSeleccionada?.name || ''">
        <option value="" disabled selected>Elige una plantilla oficial aprobada</option>
        <option *ngFor="let p of plantillas" [value]="p.name">
          {{ p.name }} &nbsp;&middot;&nbsp; {{ p.language }}
        </option>
      </select>
      <i class="fas fa-chevron-down select-arrow"></i>
    </div>
  </div>

  <div class="template-success-box" *ngIf="plantillaSeleccionada">
    <div class="success-icon-wrap">
      <i class="fas fa-check"></i>
    </div>
    <div>
      <div class="success-title">Plantilla activa</div>
      <div class="success-meta">{{ plantillaSeleccionada.name }} &bull; {{ plantillaSeleccionada.language }}</div>
    </div>
  </div>

  <div class="loading-box" *ngIf="!plantillas.length">
    <div class="spinner-border text-primary spinner-border-sm flex-shrink-0"></div>
    <div>
      <div class="loading-text">Sincronizando con Meta Business</div>
      <div class="loading-sub">Esto puede tardar unos segundos...</div>
    </div>
  </div>

</div>
