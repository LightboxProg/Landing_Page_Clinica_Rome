<div class="gestion-page">
  <!-- Page Header -->
  <section class="page-header">
    <div class="container">
      <h1 class="page-title">
        <i class="fas fa-cogs"></i>
        Panel de Gestión
      </h1>
      <p class="page-subtitle">Administra los servicios estéticos y membresías de Clínica Rome</p>
    </div>
  </section>

  <!-- Tabs -->
  <div class="container">
    <div class="tabs-container">
      <button class="tab-btn" [class.active]="tabActivo === 'servicios'" (click)="cambiarTab('servicios')"
        id="tab-servicios">
        <i class="fas fa-spa"></i>
        <span>Servicios Estéticos</span>
      </button>
      <button class="tab-btn" [class.active]="tabActivo === 'serviciosDentales'" (click)="cambiarTab('serviciosDentales')"
        id="tab-servicios-dentales">
        <i class="fas fa-tooth"></i>
        <span>Servicios Dentales</span>
      </button>
      <button class="tab-btn" [class.active]="tabActivo === 'membresias'" (click)="cambiarTab('membresias')"
        id="tab-membresias">
        <i class="fas fa-id-card"></i>
        <span>Membresías</span>
      </button>
      <button class="tab-btn" [class.active]="tabActivo === 'suscripciones'" (click)="cambiarTab('suscripciones')"
        id="tab-suscripciones">
        <i class="fas fa-users"></i>
        <span>Suscripciones Activas</span>
      </button>
      <button class="tab-btn" [class.active]="tabActivo === 'corteDiario'" (click)="cambiarTab('corteDiario')"
        id="tab-corte-diario">
        <i class="fas fa-cash-register"></i>
        <span>Corte Diario</span>
      </button>
      <button class="tab-btn" [class.active]="tabActivo === 'promociones'" (click)="cambiarTab('promociones')"
        id="tab-promociones">
        <i class="fas fa-percent"></i>
        <span>Promociones</span>
      </button>
      <div class="tab-indicator" 
           [class.tab-1]="tabActivo === 'serviciosDentales'"
           [class.tab-2]="tabActivo === 'membresias'" 
           [class.tab-3]="tabActivo === 'suscripciones'"
           [class.tab-4]="tabActivo === 'corteDiario'"
           [class.tab-5]="tabActivo === 'promociones'"></div>
    </div>
  </div>

  <!-- Tab Content -->
  <div class="container tab-content">
    <!-- Tab: Servicios -->
    <div class="tab-panel" *ngIf="tabActivo === 'servicios'">
      <div class="panel-layout">
        <div class="panel-main">
          <app-gestion-servicios></app-gestion-servicios>
        </div>
        <div class="panel-side">
          <app-gestion-categorias></app-gestion-categorias>
        </div>
      </div>
    </div>

    <!-- Tab: Servicios Dentales -->
    <div class="tab-panel" *ngIf="tabActivo === 'serviciosDentales'">
      <div class="panel-layout">
        <div class="panel-main">
          <app-gestion-servicios-dentales></app-gestion-servicios-dentales>
        </div>
        <div class="panel-side">
          <app-gestion-categorias-dentales></app-gestion-categorias-dentales>
        </div>
      </div>
    </div>

    <!-- Tab: Membresías -->
    <div class="tab-panel" *ngIf="tabActivo === 'membresias'">
      <app-gestion-membresias></app-gestion-membresias>
    </div>

    <!-- Tab: Suscripciones Activas -->
    <div class="tab-panel" *ngIf="tabActivo === 'suscripciones'">
      <app-membresias-adquiridas></app-membresias-adquiridas>
    </div>

    <!-- Tab: Corte Diario -->
    <div class="tab-panel" *ngIf="tabActivo === 'corteDiario'">
      <app-corte-diario></app-corte-diario>
    </div>

    <!-- Tab: Promociones -->
    <div class="tab-panel" *ngIf="tabActivo === 'promociones'">
      <app-gestion-promociones></app-gestion-promociones>
    </div>
  </div>
</div>
