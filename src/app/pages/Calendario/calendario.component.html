<div class="calendar-admin-container">
  <app-calendar-sidebar
    [doctores]="doctores"
    [(doctorIdSeleccionado)]="doctorIdSeleccionado"
    (filterChanged)="onDoctorChange()">
  </app-calendar-sidebar>

  <main class="calendar-main">
    <full-calendar #calendar [options]="calendarOptions"></full-calendar>
  </main>

  <app-calendar-event-modal
    [isOpen]="isModalOpen"
    [event]="selectedEvent"
    (close)="closeModal()"
    (cobroRegistrado)="onDoctorChange()">
  </app-calendar-event-modal>
</div>
